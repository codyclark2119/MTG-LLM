# mlx_lm.lora settings for the Phase 1 adapter, run 3.
#
# PURPOSE: remove one confound, and only one.
#
# Every Section 9 comparison scores an adapter that trained for 0.45 epochs
# (Section 15.6). `batch_size` was halved 4 -> 2 during the Section 8.7 crash
# fixes and `iters` was never raised to compensate, so "fine-tuning does not
# beat retrieval" is entangled with "the adapter saw less than half the data
# once." This run separates them.
#
# Measured against the real dataset (2,644 train lines):
#
#   batch 2, iters  600  ->  0.454 epochs   <- what v2 actually ran
#   batch 2, iters 1322  ->  1.000 epochs   <- this run
#
# 1,322 rather than the ~1,300 named in Section 15.6: 2644 / 2 is exactly
# 1,322, so the epoch count is exact rather than approximate and the claim
# needs no rounding.
#
# ---------------------------------------------------------------------------
# WHAT IS DELIBERATELY UNCHANGED FROM v2
#
# Everything. `iters` is the single edited value. Same model, same data, same
# seed, same batch size, same LoRA geometry, same eval/save cadence.
#
# That buys a free correctness check: with an identical seed and batch size,
# the first 600 iterations should reproduce v2.
#
# CORRECTED 2026-08-14. This block used to say "if the loss curve at iteration
# 600 does not match v2's" — a check that cannot be run, because v2's loss
# curve was never recorded. No v2 training log was kept and the plan has no
# v2 loss table. The 1.159 / 1.631 figures quoted below belong to RUN 1
# (Section 8.6: `phase1_lora.yaml`, batch 4, the 569-example ungrounded set),
# not to v2, which trained on 2,644 grounded examples at batch 2. Do not read
# them as v2's trajectory.
#
# Compare the WEIGHTS instead, which is strictly stronger than comparing a
# summary statistic and needs nothing that was not saved:
#
#   import mlx.core as mx
#   a = mx.load("models/mtg-rules-adapter-v2/0000600_adapters.safetensors")
#   b = mx.load("models/mtg-rules-adapter-v3/0000600_adapters.safetensors")
#   d = sum(float(mx.sum(mx.abs(a[k] - b[k]))) for k in a) / 23_068_672
#
# Scale for reading `d`: 100 iterations of real training moves these weights by
# a mean absolute 8.1e-4 (measured, v2 0000500 vs 0000600). So d near 1e-7 means
# the runs agree and only `iters` changed; d anywhere near 1e-4 means something
# else did, and the comparison is void — check before reading any result.
#
# RAN 2026-08-14: d == 0.0 exactly, at all six shared checkpoints (100..600),
# all 224 tensors. mlx-lm is fully deterministic here, so v3 re-derives v2
# step for step. That also recovers v2's lost val-loss curve: identical
# weights on an identical val set give identical losses, so this run's log IS
# v2's log through iteration 600 (1.986 / 1.231 / 0.990 / 0.966 / 0.975 at
# iters 1 / 150 / 300 / 450 / 600). See Section 15.6.
#
# It also means this run is a strict SUPERSET of v2: checkpoints 100-600
# re-derive what v2 had, and 700-1322 are the new information.
#
# Two things were considered and rejected, both because they would change a
# second variable and destroy that property:
#
#   - resume_adapter_file from 0000600_adapters.safetensors. Would cost ~3.4h
#     instead of ~6.2h, but mlx-lm restores adapter weights without optimizer
#     state, so the Adam moments would reset mid-run — a discontinuity at
#     exactly the iteration the comparison hinges on. Not worth 3 hours.
#   - grad_accumulation_steps (available in mlx-lm 0.31.3, unused in v2).
#     Would give an effective batch of 4 at batch-2 memory, which is the right
#     lever for the 36GB envelope — but it changes gradient noise. Worth
#     trying as run 4, not folded in here.
#
# ---------------------------------------------------------------------------
# WHAT TO EXPECT, STATED IN ADVANCE
#
# PREDICTED: validation loss will get WORSE, not better, because RUN 1
# bottomed at iteration 200 (1.159) and climbed to 1.631 by 600.
#
# RESULT: no overfitting. Val loss fell to ~0.97 by iteration 450 and never
# rose above it again; the run ended at 0.657. Run 1 bottomed at 1.41 EPOCHS,
# having cycled its 569 examples more than once, while iteration 600 here is
# 0.454 epochs with nothing seen twice. Overfitting needs repetition.
#
# BUT DO NOT READ THIS CURVE FINELY — see Section 18.2. `val_batches: 8` at
# batch 2 scores 16 of 327 validation examples, and mlx-lm sorts the dataset
# by length then permutes UNSEEDED, so every pass scores a different 16 from
# different length strata. Measured at a frozen checkpoint, eight draws span
# 0.256 while the whole curve past iteration 600 spans 0.113. Only the early
# descent (~1.0 over iterations 1-450) clears the noise.
#
# RUN 4 MUST SET `val_batches: -1` and a fixed validation seed. Not changed
# here: editing this file would break the bit-identical reproduction of v2
# that makes this run a clean one-variable comparison.
#
# Left standing, and now the ONLY basis for selection: the judge eval. Val
# loss measures agreement with a set generated BY base+RAG, so it reports
# teacher imitation rather than answer quality. The self-distillation ceiling
# is untouched by it.
#
# The reason to run it anyway is that val loss here measures agreement with
# the SFT set's own distribution — and that set was generated by base+RAG,
# so val loss largely measures how well the student mimics its teacher. That
# is precisely the self-distillation ceiling under test. Whether it tracks
# downstream judge scores is an open question this run can answer.
#
# So: select the promoted checkpoint by the Section 9 JUDGE EVAL across
# several checkpoints, not by val loss alone. `save_every: 100` gives 13
# candidates (~1.2GB total, all worth keeping until one is promoted).
#
# Cost: ~28 min per 100 iterations measured from v2's file timestamps,
# so ~6.2 hours. Run it overnight.
#
# Usage:
#   mlx_env/bin/python3 -m mlx_lm lora -c configs/phase1_lora_v3.yaml
# Then promote the winner:
#   cp models/mtg-rules-adapter-v3/00013XX_adapters.safetensors \
#      models/mtg-rules-adapter-v3-best/adapters.safetensors

model: mlx-community/Qwen2.5-7B-Instruct-4bit
train: true
data: ./data/datasets
adapter_path: ./models/mtg-rules-adapter-v3

fine_tune_type: lora
num_layers: 16
lora_parameters:
  rank: 16
  dropout: 0.0
  scale: 20.0

# Unchanged from v2 — see the header. batch_size 2 is measured, not guessed:
# it peaks at 9.2GB and sustains ~0.066 it/s, and raising it to 4 lost more to
# per-step cost than it won back in throughput.
batch_size: 2
grad_checkpoint: true
clear_cache_threshold: 8
iters: 1322
learning_rate: 1.0e-4
max_seq_length: 2048

val_batches: 8
steps_per_report: 10
steps_per_eval: 150
save_every: 100

seed: 42
