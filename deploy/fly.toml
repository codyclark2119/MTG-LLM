# fly.io config for the rubric authoring / judge adjudication form.
#
#   fly launch --no-deploy --copy-config --config deploy/fly.toml --dockerfile deploy/Dockerfile
#   fly deploy --config deploy/fly.toml
#
# Then follow deploy/README.md.
#
# NEVER bare `fly launch`. It auto-detects this repo as a generic Python app and
# writes a root Dockerfile containing `COPY . .`, a root fly.toml, and a GitHub
# workflow that deploys on push to main — 5.0 GB on a public host including the
# gold set, the adjudication queue, 3.8 GB of adapters and `scripts/webui.py`
# with its script runner. That happened on 2026-08-20; nothing shipped only
# because no build ran. `scripts/test_deploy.py` fails if those files reappear.
#
# This file was regenerated by `--copy-config`, which is fine — it pointed
# `dockerfile` at deploy/Dockerfile — but it strips comments and invents an app
# name, so both have been set back by hand. If you re-run it, expect to do that
# again.
#
# `mtg-llm` is the chosen name. Fly app names are globally unique, so this must
# match an app you own or the deploy creates a new one.
app = 'mtg-llm'
primary_region = 'ord'

[build]
  # RELATIVE TO THIS FILE, not to the repo root — the two are different bases
  # and mixing them is a deploy-time failure:
  #
  #   dockerfile   resolved against deploy/, this file's directory
  #   COPY paths   resolved against the BUILD CONTEXT, which is
  #                `fly deploy [WORKING_DIRECTORY]`, defaulting to the cwd
  #
  # `--copy-config` rewrote this to 'deploy/Dockerfile' assuming root-relative
  # and produced `deploy/deploy/Dockerfile not found`. Plain 'Dockerfile' is
  # correct here.
  #
  # **Run `fly deploy` from the repo root.** deploy/Dockerfile's COPY paths are
  # repo-root-relative (`scripts/rubric_server.py`), and the root .dockerignore
  # — which is what holds the context to four files — only applies when the
  # context IS the repo root. Deploying from inside deploy/ breaks both.
  dockerfile = 'Dockerfile'

[env]
  HOST = '0.0.0.0'
  PORT = '8080'
  SUBMISSIONS_FILE = '/data/submissions.jsonl'
  # Either kind of task file — rubric authoring or judge adjudication. The
  # server picks the form from the file's own `kind` field.
  TASKS_FILE = '/app/data/gold/worksheets/tasks.json'

# Contributors' work lives here, NOT in the image. Without this a redeploy —
# which is exactly what pushing a fresh tasks.json does — would take the
# submissions log with it.
[[mounts]]
  source = 'rubric_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  # Suspend rather than stop, and scale to zero: a cold start costs a
  # contributor a few seconds on their first click, and suspend makes that
  # short enough to be worth the saving.
  min_machines_running = 0

  [http_service.http_options]
    [http_service.http_options.response]
      [http_service.http_options.response.headers]
        Referrer-Policy = 'no-referrer'
        X-Content-Type-Options = 'nosniff'
        X-Frame-Options = 'DENY'

  # /healthz is exempt from the token check in rubric_server.py — a platform
  # health check arrives with no token, so gating it would mark every machine
  # unhealthy and keep the app permanently down. It exposes a task count.
  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '5s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
