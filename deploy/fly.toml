# fly.io config for the rubric authoring form.
#   fly launch --no-deploy --copy-config --config deploy/fly.toml
# Then follow deploy/README.md.
#
# Rename `app` before the first deploy — fly app names are globally unique.
app = "magic-llm-rubrics"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile"

[env]
  HOST = "0.0.0.0"
  PORT = "8080"
  TASKS_FILE = "/app/data/gold/worksheets/tasks.json"
  SUBMISSIONS_FILE = "/data/submissions.jsonl"

# Contributors' work lives here, NOT in the image. Without this a redeploy —
# which is exactly what pushing a fresh tasks.json does — would take the
# submissions log with it.
[[mounts]]
  source = "rubric_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  # Not zero. Scaling to zero is fine for the form itself, but a cold start on
  # a suspended machine costs a contributor several seconds on their first
  # click, and the whole point is to keep the friction near zero.
  min_machines_running = 0

  [http_service.http_options.response.headers]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"

  [[http_service.checks]]
    grace_period = "5s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
